version: 2

builds:
  - id: tix
    main: ./cmd/tix
    binary: tix
    # The Keychain code uses cgo, so releases are built on macOS for macOS only.
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # The tag keeps its "v", which marks the binary as a release build.
      - -s -w -X main.version={{.Tag}}

archives:
  - id: default
    name_template: "tix-for-jira_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

brews:
  - name: tix-for-jira
    directory: Formula
    skip_upload: auto
    repository:
      owner: nyactl
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/nyactl/tix-for-jira"
    description: "Your own Jira Cloud tickets from the terminal or as an MCP server, privacy-scoped and approval-gated"
    license: "MIT"
    install: |
      bin.install "tix"
    test: |
      system "#{bin}/tix", "--version"

# Release notes come from CHANGELOG.md via --release-notes (see the release
# workflow); with a notes file, GoReleaser does not generate a changelog.
